<!--
=====================================================================
MAINTAINER NOTES (read this first)
=====================================================================
One self-contained file. No build step, no framework, no other files.
All content lives in the SITE object in the script block at the bottom.
To change the site, edit that object. Do not edit the HTML cards by hand.

STRUCTURE (three flat sections, in this order)
  Resources -> guides and reference material (start here)
  Skills    -> Claude skills, one card each, filterable by category
  Tools     -> ready-to-use tools and hubs hosted elsewhere

HOW TO
  Add / remove / hide an item: add, delete, or set active:false on its entry.
  Add a skill: copy an entry in SITE.skills. The slash command is the only
    call to action; skill cards have no link.
    Standalone marketing skill: leave group off. It shows as a card; cat is
    the small label on the card. Cards show the slash command. A card with an
    href shows an "Open" link and status badge instead (used for the Applause
    Messaging plugin).
    Skill that works with others: add group, lane and an optional step. Groups
    and lanes are defined in SITE.skillGroups (the PMM Skills Pack is one).
    Secondary skill (one-off or utility): set tier:'secondary'. It shows as a
    slim row under "Also useful".
  Tool group: define it in SITE.toolGroups and add group:'<id>' to each tool.
    Grouped tools show as slim rows in one panel above the other tool cards.
  Placeholder tool or resource: placeholder:true renders a non-clickable card
    or row. When it is ready, delete placeholder:true and add href (and a
    status).
  Colors: theme is one of blue, aqua, sky, gold, navy (see THEMES).
  Status badge: 'live', 'alpha' or 'separate'.
  Favicon: embedded as a data URI in the link rel="icon" tag in the head, so the
    file stays self-contained. To change it, replace that tag.
  Owner: set SITE.owner.name. The footer shows "Maintained by <name>" only once the
    name is filled in (the placeholder [OWNER] stays hidden).

ITEMS WITH active:false in SITE.skills
  These skills exist in the Claude skill set but were not on the old site.
  Confirm each is shared org-wide, then flip to true.

LINK INVENTORY (where each link points, so nothing breaks silently)
  Claude plugins page ...... Applause Messaging plugin (deployed to everyone by default)
  Claude Design ............ Applause Google Slides Design, Applause Brand (claude.ai/design)
  Google Drive ............. Marketing Drive folder, Campaign Plugin folder,
                             Gemini Notebooks list (Google Sheet),
                             AEO / GEO folder (AEO tool card)
  Gemini ................... Logo Permissions Bot
  GitHub Pages (dpnation) .. Digest, Getting Started, Super Prompt,
                             AI Tool Guide,
                             Market Intelligence hub, Scan Archive
  The GitHub Pages items sit on a personal account. If that account goes away
  those links go dark. Re-point them in SITE once the content has a new home.
  Verify links before publishing. A link on a live page does not mean the
  target exists.
=====================================================================
-->

<style>
 :root {
 --blue-500:#0272B4; --blue-600:#025B90; --blue-700:#01446C; --blue-300:#CFE9FB;
 --blue-100:#E6F3FA; --blue-50:#F7FBFE;
 --aqua-500:#00C0A3; --aqua-600:#009A82; --yellow-500:#FFC400;
 --gray-700:#3D3D3D; --gray-600:#6B6B6B; --gray-400:#C2C2C2;
 --white:#fff;
 --font:'DM Sans', Arial, sans-serif; --mono:'DM Mono', monospace;
 }
 *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
 html{scroll-behavior:smooth;scroll-padding-top:72px}
 body{font-family:var(--font);background:var(--blue-50);color:var(--gray-700);min-height:100vh;overflow-x:hidden}
 a{color:inherit}

 /* NAV */
 nav{position:sticky;top:0;z-index:100;background:var(--blue-700);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;gap:24px;height:60px}
 .nav-brand{display:flex;align-items:center;gap:14px;text-decoration:none;flex-shrink:0}
 .logo{width:auto;display:block}
 .nav-logo{height:20px}
 .nav-title{font-size:12px;font-weight:500;color:#B9DCEE;letter-spacing:.02em;border-left:1px solid rgba(255,255,255,.3);padding-left:14px;white-space:nowrap}
 .nav-right{display:flex;align-items:center;gap:28px;margin-left:auto}
 .nav-links{display:flex;align-items:center;gap:28px}
 .nav-link{font-size:14px;font-weight:600;text-decoration:none;color:#B9DCEE;padding-bottom:4px;border-bottom:2px solid transparent;transition:color .15s}
 .nav-link:hover{color:#fff}
 .nav-drive{display:flex;align-items:center;gap:6px;text-decoration:none;color:#B9DCEE;font-size:13px;font-weight:600;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.08);transition:color .15s,background .15s;white-space:nowrap}
 .nav-drive:hover{color:#fff;background:rgba(255,255,255,.16)}
 .nav-drive svg{width:15px;height:auto}

 /* HERO */
 .hero{background:linear-gradient(135deg,var(--blue-700) 0%,var(--blue-500) 100%);padding:56px 2rem 56px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;position:relative;overflow:hidden}
 .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 20% 80%,rgba(0,192,163,.18) 0%,transparent 60%),radial-gradient(ellipse 40% 50% at 80% 10%,rgba(255,255,255,.06) 0%,transparent 60%);pointer-events:none}
 .hero-logo{height:32px;position:relative}
 .hero h1{font-size:clamp(32px,5vw,44px);font-weight:800;color:#fff;line-height:1.2;letter-spacing:-.01em;max-width:760px;position:relative}

 /* OVERVIEW */
 .overview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;max-width:1000px;margin-top:6px;text-align:left;position:relative}
 .overview-card{border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:16px 20px;display:flex;flex-direction:row;align-items:flex-start;gap:14px;background:rgba(255,255,255,.12);text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
 .overview-card:hover{transform:translateY(-3px);background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4)}
 .overview-text{display:flex;flex-direction:column;gap:3px;min-width:0}
 .overview-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
 .overview-icon{flex-shrink:0;width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:18px}
 .overview-title{font-size:17px;font-weight:800;color:#fff}
 .overview-body{font-size:13.5px;line-height:1.45;color:#DCEFFA}
 .overview-link{font-size:13px;font-weight:700;margin-top:2px;color:#fff}

 /* SECTIONS */
 .section-wrap{padding:56px 0 64px}
 .section-wrap--tint{background:var(--blue-100)}
 .section-inner{max-width:1200px;margin:0 auto;padding:0 2rem}
 .section-label{font-size:12px;font-weight:700;color:var(--aqua-600);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
 .section-title{font-size:28px;font-weight:800;color:var(--blue-700);letter-spacing:-.01em;margin-bottom:8px}
 .section-sub{font-size:14.5px;margin-bottom:28px;max-width:620px;line-height:1.5}

 /* CARDS */
 .grid{display:grid;gap:20px}
 .grid--tools{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
 .grid--resources{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
 .grid--skills{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
 .card{background:var(--white);border-radius:16px;border:1.5px solid var(--blue-100);padding:26px 26px 22px;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s,border-color .2s;position:relative;overflow:hidden}
 .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--blue-500));opacity:0;transition:opacity .2s}
 a.card{cursor:pointer}
 a.card:hover,.card--skill:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(2,114,180,.12);border-color:var(--accent,var(--blue-500))}
 a.card:hover::before,.card--skill:hover::before{opacity:1}
 .card-icon{width:44px;height:44px;border-radius:12px;background:var(--icon-bg,var(--blue-100));display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:21px;flex-shrink:0}
 .card-tag{display:inline-flex;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tag-color,var(--blue-500));background:var(--tag-bg,var(--blue-100));border-radius:4px;padding:3px 8px;margin-bottom:10px;width:fit-content}
 .card-name{font-size:17px;font-weight:800;color:var(--blue-700);letter-spacing:-.01em;margin-bottom:8px;line-height:1.25}
 .card-desc{font-size:13.5px;color:var(--gray-600);line-height:1.55;flex:1;margin-bottom:18px}
 .card-note{font-size:12px;font-style:italic;color:var(--gray-600);margin:-10px 0 16px}
 .card-footer{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--blue-100);gap:8px}
 .card-cta{font-size:13px;font-weight:700;color:var(--cta,var(--accent,var(--blue-500)));letter-spacing:.02em;display:flex;align-items:center;gap:5px;text-decoration:none}
 .arrow{transition:transform .15s;font-size:16px}
 a.card:hover .arrow,.card--skill:hover .arrow{transform:translateX(3px)}
 .status{font-size:11px;font-weight:600;color:#009A82;background:#E1F5EE;border-radius:4px;padding:3px 8px;letter-spacing:.04em;white-space:nowrap}
 .status--alpha{color:#5C3D8F;background:#EDE7F6}
 .status--separate{color:#01446C;background:#E6F3FA}

 /* FLAT TOOL CARDS */
 .tcard{display:flex;gap:14px;align-items:flex-start;background:var(--white);border:1.5px solid var(--blue-100);border-radius:12px;padding:14px 16px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s,box-shadow .15s}
 a.tcard{cursor:pointer}
 a.tcard:hover{transform:translateY(-2px);border-color:var(--accent,var(--blue-500));box-shadow:0 8px 20px rgba(2,114,180,.1)}
 .tcard--placeholder{border-style:dashed;border-color:#C9E3F1;background:var(--blue-50);cursor:default}
 .tcard-icon{width:36px;height:36px;border-radius:9px;background:var(--icon-bg,var(--blue-100));display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
 .tcard-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
 .tcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
 .tcard-tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tag-color,var(--blue-500))}
 .tcard-name{font-size:15px;font-weight:800;color:var(--blue-700);line-height:1.25}
 .tcard-desc{font-size:12.5px;color:var(--gray-600);line-height:1.45}
 .tcard-cta{font-size:12.5px;font-weight:700;color:var(--cta,var(--accent,var(--blue-500)));margin-top:4px}
 .tg-rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
 .group .res{background:var(--blue-50);border-color:var(--blue-100)}
 .group .res--placeholder{border-color:#C9E3F1}

 /* RESOURCES: slim rows, one-time reading */
 .res{display:flex;align-items:center;gap:12px;background:var(--white);border:1.5px solid var(--blue-100);border-radius:10px;padding:10px 14px;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
 .res:hover{border-color:var(--accent,var(--blue-500));box-shadow:0 6px 18px rgba(2,114,180,.1)}
 .res-icon{width:32px;height:32px;border-radius:8px;background:var(--icon-bg,var(--blue-100));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
 .res-text{flex:1;min-width:0}
 .res-name{font-size:14px;font-weight:700;color:var(--blue-700);line-height:1.25}
 .res-desc{font-size:12px;color:var(--gray-600);line-height:1.35;margin-top:2px}
 .res--placeholder{border-style:dashed;border-color:#C9E3F1;background:var(--blue-50);cursor:default}
 .res--placeholder:hover{border-color:#C9E3F1;box-shadow:none}
 .res-badge{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gray-600);flex-shrink:0}
 .res-arrow{color:var(--accent,var(--blue-500));font-size:15px;flex-shrink:0}

 /* SKILLS */
 .card--skill{padding:20px 22px 18px}
 .skill-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
 .skill-head .card-icon{margin-bottom:0;width:38px;height:38px;font-size:18px}
 .skill-head .card-name{margin-bottom:0;font-size:16px}
 .skill-cat{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-600)}
 .skill-cmd{font-family:var(--mono);font-size:12px;color:var(--blue-700);background:var(--blue-100);border:0;border-radius:5px;padding:4px 9px;cursor:pointer}
 .skill-cmd:hover{background:var(--blue-300)}
 .card--skill .card-footer{border-top:0;padding-top:0}
 /* GROUPED SKILLS (skills built to work together) */
 .group{background:var(--white);border:1.5px solid var(--blue-300);border-radius:16px;padding:24px 26px 26px}
 .group-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px}
 .group-icon{width:42px;height:42px;border-radius:11px;background:var(--blue-100);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
 .group-title{font-size:18px;font-weight:800;color:var(--blue-700);letter-spacing:-.01em}
 .group-sub{font-size:13.5px;color:var(--gray-600);line-height:1.5;margin-top:2px;max-width:640px}
 .lanes{display:grid;grid-template-columns:1fr 1fr;gap:22px}
 .lane--wide{grid-column:1/-1}
 .lane-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--aqua-600)}
 .lane-sub{font-size:12.5px;color:var(--gray-600);line-height:1.4;margin:2px 0 10px}
 .lane-rows{display:flex;flex-direction:column;gap:8px}
 .group .sk{background:var(--blue-50);border:1px solid var(--blue-100);align-items:flex-start}
 .group .sk .skill-cmd{margin-top:7px}
 .step{flex-shrink:0;min-width:26px;height:26px;padding:0 8px;border-radius:13px;background:var(--blue-700);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
 .also{margin-top:36px}
 .also-title{font-size:16px;font-weight:800;color:var(--blue-700);margin-bottom:4px}
 .also-sub{font-size:13px;color:var(--gray-600);margin-bottom:14px}
 .grid--also{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
 .sk{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.65);border:1px solid var(--blue-300);border-radius:10px;padding:10px 14px}
 .sk-icon{font-size:16px;flex-shrink:0}
 .sk-text{flex:1;min-width:0}
 .sk-name{font-size:14px;font-weight:700;color:var(--blue-700);line-height:1.25}
 .sk-desc{font-size:12px;color:var(--gray-600);line-height:1.35;margin-top:2px}
 .hint{font-size:12.5px;color:var(--gray-600);margin-top:18px}

 /* CTA + FOOTER */
 footer{background:var(--blue-100);padding:40px 2rem 24px}
 .footer-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:32px}
 .footer-brand-col{display:flex;flex-direction:column;align-items:flex-start;gap:10px;max-width:560px}
 .footer-logo{height:18px;--logo-fg:#01446C;--logo-ring:#00C0A3}
 .footer-blurb{font-size:13px;line-height:1.5}
 .footer-cols{display:flex;gap:56px;flex-wrap:wrap}
 .footer-col{display:flex;flex-direction:column;gap:10px}
 .footer-col-title{font-size:12px;font-weight:700;color:var(--blue-700);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
 .footer-col a,.footer-col span:not(.footer-col-title){font-size:13px;text-decoration:none}
 .footer-col a:hover{color:var(--blue-500)}
 .footer-bottom{max-width:1200px;margin:24px auto 0;border-top:1px solid var(--blue-300);padding-top:16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
 .footer-bottom span{font-size:12px;color:var(--gray-600)}

 @media (max-width:1000px){.overview-grid{grid-template-columns:1fr}}
 @media (max-width:800px){.lanes{grid-template-columns:1fr}}
 @media (max-width:700px){.nav-links{display:none}.nav-title{display:none}.grid--skills{grid-template-columns:1fr}}
</style>

  navy: { accent:'#01446C', iconBg:'#CFE9FB', tagColor:'#01446C', tagBg:'#CFE9FB' }
};

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const active = list => list.filter(i => i.active !== false);
const $ = id => document.getElementById(id);
const themeStyle = t => { const th = THEMES[t] || THEMES.blue; return `--accent:${th.accent};--icon-bg:${th.iconBg};--tag-color:${th.tagColor};--tag-bg:${th.tagBg};--cta:${th.cta || th.accent}`; };

function linkCard(item) {
  const status = item.status ? `<span class="status${item.statusStyle ? ' status--' + esc(item.statusStyle) : ''}">${esc(item.status)}</span>` : '';
  const head = `<div class="tcard-icon">${item.icon}</div>`;
  const body = (cta) => `<div class="tcard-body">
      <div class="tcard-top"><span class="tcard-tag">${esc(item.tag)}</span>${status}</div>
      <div class="tcard-name">${esc(item.name)}</div>
      <div class="tcard-desc">${esc(item.desc)}</div>
      ${cta}
    </div>`;
  if (item.placeholder) {
    return `<div class="tcard tcard--placeholder" style="${themeStyle(item.theme)}">${head}${body(`<span class="tcard-cta" style="color:var(--gray-600)">${esc(item.pending || 'Not live yet')}</span>`)}</div>`;
  }
  return `<a class="tcard" href="${esc(item.href)}" target="_blank" rel="noopener" style="${themeStyle(item.theme)}">${head}${body(`<span class="tcard-cta">${esc(item.cta || 'Open')} &rarr;</span>`)}</a>`;
}

function toolGroupPanel(g, tools) {
  const rows = tools.filter(t => t.group === g.id);
  if (!rows.length) return '';
  return `<div class="group">
    <div class="group-head"><div class="group-icon">${g.icon}</div>
      <div><div class="group-title">${esc(g.title)}</div><div class="group-sub">${esc(g.sub)}</div></div></div>
    <div class="tg-rows">${rows.map(resourceRow).join('')}</div>
  </div>`;
}

function resourceRow(r) {
  if (r.placeholder) {
    return `<div class="res res--placeholder" style="${themeStyle(r.theme)}">
    <div class="res-icon">${r.icon}</div>
    <div class="res-text"><div class="res-name">${esc(r.name)}</div><div class="res-desc">${esc(r.desc)}</div></div>
    <span class="res-badge">${esc(r.badge || 'Link coming')}</span>
  </div>`;
  }
  return `<a class="res" href="${esc(r.href)}" target="_blank" rel="noopener" style="${themeStyle(r.theme)}">
    <div class="res-icon">${r.icon}</div>
    <div class="res-text"><div class="res-name">${esc(r.name)}</div><div class="res-desc">${esc(r.desc)}</div></div>
    <span class="res-arrow">&rarr;</span>
  </a>`;
}

function skillCard(s) {
  return `<div class="card card--skill" style="--accent:#0272B4;--icon-bg:#E6F3FA">
    <div class="skill-head">
      <div class="card-icon">${s.icon}</div>
      <div><div class="skill-cat">${esc(s.cat)}</div><div class="card-name">${esc(s.name)}</div></div>
    </div>
    <div class="card-desc" style="margin-bottom:${s.note ? '10px' : '16px'}">${esc(s.desc)}</div>
    ${s.note ? `<div class="card-note">${esc(s.note)}</div>` : ''}
    <div class="card-footer">
      ${s.href
        ? `<a class="card-cta" href="${esc(s.href)}" target="_blank" rel="noopener" style="--cta:#0272B4">${esc(s.cta || 'Open')} <span class="arrow">&rarr;</span></a>${s.status ? `<span class="status">${esc(s.status)}</span>` : ''}`
        : `<button class="skill-cmd" type="button" data-cmd="${esc(s.cmd)}" title="Click to copy">${esc(s.cmd)}</button>`}
    </div>
  </div>`;
}

const isPrimary = s => s.tier !== 'secondary';

function skillRow(s, stack) {
  const lead = s.step != null && s.step !== '' ? `<span class="step">${esc(s.step)}</span>` : `<span class="sk-icon">${s.icon}</span>`;
  const cmd = `<button class="skill-cmd" type="button" data-cmd="${esc(s.cmd)}" title="Click to copy">${esc(s.cmd)}</button>`;
  return `<div class="sk">
    ${lead}
    <div class="sk-text"><div class="sk-name">${esc(s.name)}</div><div class="sk-desc">${esc(s.desc)}</div>${stack ? cmd : ''}</div>
    ${stack ? '' : cmd}
  </div>`;
}

function groupPanel(g, skills) {
  const lanes = g.lanes.map(l => {
    const rows = skills.filter(s => s.group === g.id && s.lane === l.id);
    if (!rows.length) return '';
    return `<div class="lane${l.wide ? ' lane--wide' : ''}">
      <div class="lane-title">${esc(l.title)}</div><div class="lane-sub">${esc(l.sub)}</div>
      <div class="lane-rows">${rows.map(r => skillRow(r, true)).join('')}</div>
    </div>`;
  }).join('');
  return `<div class="group">
    <div class="group-head"><div class="group-icon">${g.icon}</div>
      <div><div class="group-title">${esc(g.title)}</div><div class="group-sub">${esc(g.sub)}</div></div></div>
    <div class="lanes">${lanes}</div>
  </div>`;
}

function init() {
  const resources = active(SITE.resources), skills = active(SITE.skills), tools = active(SITE.tools);

  document.title = 'Applause ' + SITE.title;
  $('nav-title').textContent = SITE.title;
  $('hero-title').textContent = SITE.title;
  $('nav-drive').href = SITE.driveUrl;

  // Overview cards
  const ov = [
    { icon:'📚', bg:'#E1F5EE', link:'#009A82', href:'#resources', title:'Resources', body:'Guides and reference for working with Claude, plus team notebooks and shared files.', cta:'View resources' },
    { icon:'🧠', bg:'#E6F3FA', link:'#0272B4', href:'#skills', title:'Skills', body:'Claude skills for messaging, positioning, competitive work and buyer research.', cta:'Browse skills' },
    { icon:'⚙️', bg:'#FFF6DA', link:'#8a6d00', href:'#tools', title:'Tools', body:'Ready-to-use tools and hubs for everyday marketing work.', cta:'Browse tools' }
  ];
  $('overview').innerHTML = ov.map(o => `<a class="overview-card" href="${o.href}" style="--icon-bg:${o.bg};--link:${o.link}">
    <div class="overview-icon">${o.icon}</div>
    <div class="overview-text">
      <div class="overview-head"><span class="overview-title">${o.title}</span></div>
      <div class="overview-body">${o.body}</div>
      <div class="overview-link">${o.cta} &rarr;</div>
    </div></a>`).join('');

  // Resources
  $('resources-title').textContent = SITE.sections.resources.title;
  $('resources-sub').textContent = SITE.sections.resources.sub;
  $('resources-grid').innerHTML = resources.map(resourceRow).join('');

  // Skills
  $('skills-title').textContent = SITE.sections.skills.title;
  $('skills-sub').textContent = SITE.sections.skills.sub;
  $('skills-groups').innerHTML = (SITE.skillGroups || []).map(g => groupPanel(g, skills)).join('');
  const ungrouped = skills.filter(s => isPrimary(s) && !s.group);
  $('skills-more-title').textContent = SITE.sections.skills.moreTitle || '';
  $('skills-grid').innerHTML = ungrouped.map(skillCard).join('');
  if (!ungrouped.length) $('skills-more-wrap').remove();
  const secondary = skills.filter(s => !isPrimary(s));
  $('skills-also').innerHTML = secondary.map(s => skillRow(s, false)).join('');
  if (!secondary.length) $('skills-also-wrap').remove();
  $('skills-hint').textContent = 'Click a command to copy it. Skills must be installed in Claude before they run.';
  $('skills').addEventListener('click', e => {
    const b = e.target.closest('.skill-cmd'); if (!b) return;
    const orig = b.textContent;
    const done = () => { b.textContent = 'Copied'; setTimeout(() => b.textContent = orig, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(b.dataset.cmd).then(done, () => {});
  });

  // Tools
  $('tools-title').textContent = SITE.sections.tools.title;
  $('tools-sub').textContent = SITE.sections.tools.sub;
  $('tools-groups').innerHTML = (SITE.toolGroups || []).map(g => toolGroupPanel(g, tools)).join('');
  if (!$('tools-groups').innerHTML.trim()) $('tools-groups').remove();
  $('tools-grid').innerHTML = tools.filter(t => !t.group).map(t => linkCard(t)).join('');

  // Footer
  $('footer-blurb').textContent = SITE.footerBlurb;
  $('footer-slack').textContent = SITE.slack;
  const ownerSet = SITE.owner.name && !SITE.owner.name.startsWith('[');
  $('footer-credit').textContent = SITE.builtBy + (ownerSet ? ' · Maintained by ' + SITE.owner.name : '');
}
init();
</script>
</body>
</html>
